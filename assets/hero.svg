<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="1000" height="320">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#09090B"/><stop offset=".55" stop-color="#1E1B4B"/><stop offset="1" stop-color="#0C4A6E"/></linearGradient>
<linearGradient id="nm" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="520" y2="0" spreadMethod="reflect"><stop offset="0" stop-color="#A78BFA"/><stop offset=".5" stop-color="#67E8F9"/><stop offset="1" stop-color="#A78BFA"/>
